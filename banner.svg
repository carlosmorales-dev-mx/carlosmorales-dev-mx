<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="card"><rect width="900" height="250" rx="18"/></clipPath>
  </defs>

  <rect width="900" height="250" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="830" cy="15" r="150" fill="#38bdf8" opacity="0.13" filter="url(#soft)"/>
    <circle cx="60" cy="250" r="150" fill="#a855f7" opacity="0.11" filter="url(#soft)"/>

    <g stroke="#1e293b" stroke-width="1" opacity="0.5">
      <line x1="650" y1="0" x2="650" y2="250"/>
      <line x1="730" y1="0" x2="730" y2="250"/>
      <line x1="810" y1="0" x2="810" y2="250"/>
      <line x1="570" y1="62" x2="900" y2="62"/>
      <line x1="570" y1="125" x2="900" y2="125"/>
      <line x1="570" y1="188" x2="900" y2="188"/>
    </g>

    <!-- MX medallion: tricolor ring, no Italy confusion -->
    <g transform="translate(758,125)">
      <circle r="70" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <!-- tricolor ring arcs: green / white / red -->
      <g fill="none" stroke-width="6" stroke-linecap="round">
        <path d="M 0 -58 A 58 58 0 0 1 50.2 29" stroke="#006847"/>
        <path d="M 50.2 29 A 58 58 0 0 1 -50.2 29" stroke="#e2e8f0"/>
        <path d="M -50.2 29 A 58 58 0 0 1 0 -58" stroke="#CE1126"/>
      </g>
      <text x="0" y="15" font-size="42" font-weight="700" text-anchor="middle" fill="url(#nameGrad)" letter-spacing="2">MX</text>
      <circle r="78" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="6 14" stroke-linecap="round" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.7s" begin="0.1s" fill="freeze"/>
      <text x="56" y="100" font-size="50" font-weight="700" fill="url(#nameGrad)" letter-spacing="0.5">Carlos Morales</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" dur="0.7s" begin="0.45s" fill="freeze"/>
      <rect x="58" y="121" width="225" height="3" rx="1.5" fill="url(#accent)">
        <animate attributeName="width" from="0" to="225" dur="0.9s" begin="0.45s" fill="freeze"/>
      </rect>
      <text x="56" y="160" font-size="22" font-weight="600" fill="#e2e8f0">Backend Engineer</text>
      <text x="56" y="187" font-size="15" fill="#94a3b8">APIs · AI-powered systems · Cloud deployment</text>
    </g>

    <g opacity="0" font-size="13.5">
      <animate attributeName="opacity" to="1" dur="0.7s" begin="0.8s" fill="freeze"/>
      <circle cx="62" cy="216" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="74" y="221" fill="#94a3b8">Open to remote roles</text>
      <text x="243" y="221" fill="#475569">|</text>
      <text x="260" y="221" fill="#94a3b8">Acapulco, MX (UTC-6)</text>
      <text x="428" y="221" fill="#475569">|</text>
      <text x="445" y="221" fill="#7dd3fc">cmorales.dev</text>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="248" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="248" rx="17" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.35"/>
</svg>
