<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="0" height="40" width="0">
        <animate attributeName="width" values="0;560;560;0" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="180" rx="14" fill="url(#bg)"/>

  <text x="40" y="65" font-family="Consolas, Monaco, monospace" font-size="30" fill="#e2e8f0" font-weight="600">
    Carlos Morales
  </text>
  <text x="40" y="95" font-family="Consolas, Monaco, monospace" font-size="15" fill="#64748b">
    Backend Engineer · Systems Engineering Graduate
  </text>

  <g transform="translate(40,120)" clip-path="url(#reveal)">
    <text x="0" y="20" font-family="Consolas, Monaco, monospace" font-size="17" fill="#38bdf8">
      $ building things that solve real problems_
    </text>
  </g>

  <rect x="40" y="103" width="9" height="20" fill="#38bdf8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.32;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <circle cx="850" cy="40" r="4" fill="#ef4444"/>
  <circle cx="830" cy="40" r="4" fill="#eab308"/>
  <circle cx="810" cy="40" r="4" fill="#22c55e"/>
</svg>
